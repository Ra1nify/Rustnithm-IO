[package]
name = "rustio"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "rustio"

[dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
    "Win32_Security",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true